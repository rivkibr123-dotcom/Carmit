<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>דף בקרה למורה</title>

<style>
body{
font-family:Arial;
background:#f5f6fa;
padding:40px;
}

h1{
text-align:center;
}

.card{
background:white;
border-radius:10px;
padding:15px;
margin:15px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.student{
font-size:20px;
font-weight:bold;
}

.time{
color:gray;
font-size:14px;
}

.task{
margin-top:10px;
padding:8px;
background:#f1f2f6;
border-radius:6px;
}
</style>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyCM9jb5ool2SVijJ_uvVz-abG4m54Kg8Ro",
authDomain: "bardugo-a9979.firebaseapp.com",
projectId: "bardugo-a9979",
storageBucket: "bardugo-a9979.firebasestorage.app",
messagingSenderId: "638890782440",
appId: "1:638890782440:web:eb92bbac90415aadc8235d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadSubmissions(){

const container = document.getElementById("submissions-list");

container.innerHTML="טוען הגשות...";

try{

const appId = "passover-board-v2";

const querySnapshot = await getDocs(
collection(db, "artifacts", appId, "public", "data", "submissions")
);

container.innerHTML="";

querySnapshot.forEach((doc)=>{

const data = doc.data();

container.innerHTML += `
<div class="card">

<div class="student">
👩‍🎓 ${data.studentName || "תלמיד"}
</div>

<div class="time">
⏰ ${data.timestamp || ""}
</div>

<div class="task">
📚 משימות שהושלמו:
<br>
${JSON.stringify(data.tasks || {})}
</div>

</div>
`;

});

}catch(error){

container.innerHTML="שגיאה בטעינת הנתונים";
console.error(error);

}

}

window.onload = loadSubmissions;

</script>

</head>

<body>

<h1>📋 לוח הגשות של התלמידים</h1>

<div id="submissions-list">
טוען הגשות...
</div>

</body>
</html>
